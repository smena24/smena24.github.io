<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Shift Hub</title>
<script>
/* GitHub Pages отдаёт этот файл для любого несуществующего адреса (например /promo).
   Перекидываем на главную, она сама откроет нужный раздел по ?p= и вернёт красивый адрес. */
(function(){var l=location;l.replace(l.origin+'/?p='+encodeURIComponent(l.pathname)+(l.search?'&'+l.search.slice(1):'')+l.hash)})();
</script></head><body style="background:#120a2e"></body></html>
