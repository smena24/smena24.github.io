<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">

<style>/* KHAYYAM ORIGINALS — общий стиль игр */
:root{--acc:#ffcf6e;--acc2:#ff7a2e;--ink:#fff6ea;--glass:rgba(12,8,20,.78);--line:rgba(255,207,110,.32)}

#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#stageCv{position:fixed;inset:0;width:100%;height:100%;display:block}

.kh-q{position:fixed;top:10px;right:10px;z-index:12;display:flex;gap:4px}
.kh-q button,.kh-back{border:1px solid var(--line);background:rgba(8,6,14,.7);border-radius:10px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.1em;cursor:pointer;color:var(--acc)}
.kh-back{position:fixed;top:40px;left:10px;z-index:12;text-decoration:none;font-size:11px}

.kh-st{min-width:96px;text-align:center}.kh-st small{display:block;font-size:10px;letter-spacing:.2em;font-weight:700;opacity:.75}.kh-st b{font-size:20px;font-weight:800}

.kh-go:before{content:"";position:absolute;inset:-10px;border-radius:44px;border:2px solid color-mix(in srgb,var(--acc) 60%,transparent);animation:khring 2.4s ease-out infinite}

.kh-auto.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#2a0800}
.kh-msg{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);padding:8px 16px;border-radius:14px;background:rgba(8,4,10,.86);border:1px solid var(--line);font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:20}
.kh-msg.on{opacity:1;transform:translateX(-50%)}
.kh-ov{position:fixed;inset:0;display:none;place-items:center;z-index:40}.kh-ov.on{display:grid}
.kh-bw{background:radial-gradient(circle,rgba(0,0,0,.3),rgba(0,0,0,.82));cursor:pointer;overflow:hidden;text-align:center}
.kh-bw .t{font-family:Cinzel,serif;font-weight:900;font-size:clamp(44px,10vw,120px);line-height:1;background:linear-gradient(#fff,var(--acc) 40%,var(--acc2) 75%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 0 30px color-mix(in srgb,var(--acc2) 90%,transparent));animation:khin .8s cubic-bezier(.2,1.6,.4,1),khbr 1.1s ease-in-out .8s infinite alternate}
@keyframes khin{from{transform:scale(.2) rotateX(80deg);opacity:0}}@keyframes khbr{to{transform:scale(1.06)}}
.kh-bw .v{font-size:clamp(34px,7vw,80px);font-weight:800;text-shadow:0 0 30px color-mix(in srgb,var(--acc2) 90%,transparent)}
.kh-bw small{display:block;margin-top:8px;letter-spacing:.2em;opacity:.7;font-size:12px;font-weight:700}
.kh-bw .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--acc) 18%,transparent) 0 6deg,transparent 6deg 16deg);animation:khspin 20s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 60%);mask:radial-gradient(circle,#000 8%,transparent 60%)}
@keyframes khspin{to{transform:rotate(360deg)}}
.kh-bw .wv{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid var(--acc);transform:translate(-50%,-50%);animation:khwv 2.2s ease-out infinite;opacity:0}
.kh-bw.t1 .wv{display:none}.kh-bw .d2{animation-delay:.7s}.kh-bw .d3{animation-delay:1.4s}
@keyframes khwv{0%{width:12vmin;height:12vmin;opacity:1}100%{width:160vmin;height:160vmin;opacity:0}}
.kh-ttl{position:fixed;inset:0;display:grid;place-content:center;text-align:center;z-index:35;pointer-events:none;opacity:0}
.kh-ttl.on{animation:khttl var(--ms,3s) ease forwards}
@keyframes khttl{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.kh-ttl h2{margin:0;font-family:Cinzel,serif;font-weight:900;font-size:clamp(32px,8vw,92px);letter-spacing:.06em;background:linear-gradient(#fff,var(--acc) 45%,var(--acc2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--acc2) 90%,transparent)) drop-shadow(0 5px 0 rgba(0,0,0,.6))}
.kh-ttl p{margin:10px 0 0;font-weight:800;letter-spacing:.28em;font-size:clamp(11px,1.4vw,15px);opacity:.92}
.kh-modal{background:rgba(0,0,0,.72);z-index:50;padding:12px}
.kh-modal .in{width:min(820px,96vw);max-height:88vh;overflow:auto;padding:22px 24px;border-radius:22px;background:linear-gradient(#1c1022,#09060c);border:1px solid var(--line)}
.kh-modal h2{margin:0 0 8px;font-family:Cinzel,serif;color:var(--acc)}.kh-modal h3{margin:16px 0 6px;color:var(--acc)}
.kh-modal p,.kh-modal li{line-height:1.5;font-size:14px;opacity:.92}
.kh-modal table{border-collapse:collapse;width:100%;font-size:13px}.kh-modal td,.kh-modal th{border:1px solid var(--line);padding:5px 8px;text-align:center}
.kh-btn{padding:11px 26px;border-radius:24px;border:0;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#2a0800;font-weight:800;letter-spacing:.1em;cursor:pointer}
.kh-btn.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.kh-seg{display:flex;gap:6px;flex-wrap:wrap}.kh-seg button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:800;font-size:12px}
.kh-seg button.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#2a0800}
.kh-intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(30,10,30,.4),rgba(0,0,0,.88));transition:opacity 1.4s}
.kh-intro.fade{opacity:0;pointer-events:none}
.kh-intro h1{margin:0;font-family:Cinzel,serif;font-weight:900;font-size:clamp(34px,8vw,96px);letter-spacing:.1em;line-height:1.02;background:linear-gradient(#fff,var(--acc) 45%,var(--acc2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--acc2) 70%,transparent))}
.kh-intro .tag{letter-spacing:.42em;font-weight:700;font-size:clamp(10px,1.4vw,14px);margin-top:12px;opacity:.9}
.kh-intro .pre{letter-spacing:.5em;font-size:11px;font-weight:800;opacity:.7}
.kh-intro button{margin-top:28px;padding:16px 42px;border-radius:40px;border:1px solid var(--acc);background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 35%,transparent),rgba(10,6,14,.9));font-weight:800;letter-spacing:.3em;font-size:15px;cursor:pointer;color:#fff;box-shadow:0 0 30px color-mix(in srgb,var(--acc2) 60%,transparent);animation:khbreath 2.6s ease-in-out infinite}
@keyframes khbreath{50%{box-shadow:0 0 60px color-mix(in srgb,var(--acc2) 95%,transparent)}}
.kh-intro .note{font-size:12px;opacity:.7;margin-top:12px}
.kh-pop{position:fixed;z-index:31;pointer-events:none;transform:translate(-50%,-50%);font-family:Cinzel,serif;font-weight:900;font-size:26px;color:#fff;text-shadow:0 0 14px var(--acc2),0 3px 0 rgba(0,0,0,.6);animation:khpop 1.3s ease-out forwards;white-space:nowrap}
@keyframes khpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%)}}
@media (max-width:760px){
 .kh-bar{flex-wrap:wrap;justify-content:center;gap:7px;padding:7px 9px;width:calc(100vw - 16px)}
 .kh-st{min-width:78px}.kh-st b{font-size:16px}.kh-go{height:62px;min-width:100px;font-size:15px}
 .kh-side{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));transform:none;flex-direction:row;left:50%;translate:-50% 0}
 .kh-ib{width:40px;height:40px}.kh-dev{display:none}.kh-msg{bottom:calc(200px + env(safe-area-inset-bottom))}
}

@media(max-width:1500px){.kh-dev{max-width:200px;line-height:1.35;white-space:normal}}
@media (max-width:760px){.kh-q{top:42px}.kh-q button{padding:4px 7px;font-size:9.5px}.kh-sub{display:none}.kh-logo{font-size:clamp(16px,5.4vw,24px)!important;letter-spacing:.06em!important;padding:0 4px}}
</style></head><body>
<canvas id="bg"></canvas><canvas id="stageCv"></canvas><canvas id="fxCv"></canvas>
<script>/* KHAYYAM ORIGINALS — общий движок: RNG, кошелёк DEMO, интерфейс, эффекты, шейдерный фон, звук и музыка.
   Разработчик: Khayyam. Только DEMO-кредиты, без реальных денег.
   ВАЖНО: генератор случайных чисел демонстрационный (crypto.getRandomValues), не сертифицирован. */
(function () {
'use strict';
const KH = window.KH = {};

/* ===================== RNG ===================== */
const RB = new Uint32Array(64); let RP = 64;
function u32() { if (RP >= 64) { crypto.getRandomValues(RB); RP = 0; } return RB[RP++]; }
KH.rand = () => u32() / 4294967296;
KH.randInt = n => { const lim = Math.floor(4294967296 / n) * n; let x; do { x = u32(); } while (x >= lim); return x % n; };
KH.weighted = (items, w) => { let t = 0; for (const x of w) t += x; let r = KH.rand() * t; for (let i = 0; i < items.length; i++) { r -= w[i]; if (r < 0) return items[i]; } return items[items.length - 1]; };
KH.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = KH.randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
window.RNG = { rand: KH.rand, randInt: KH.randInt, weighted: KH.weighted, shuffle: KH.shuffle };

/* ===================== утилиты ===================== */
KH.fmt = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
KH.speed = 1;
KH.sleep = ms => new Promise(r => setTimeout(r, ms * KH.speed));
KH.ease = { out: x => 1 - Math.pow(1 - x, 3), inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, lin: x => x, back: x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); } };
KH.tween = (ms, fn, e = KH.ease.out) => new Promise(res => { const t0 = performance.now(); (function f(n) { const k = Math.min(1, (n - t0) / ms); fn(e(k)); if (k < 1) requestAnimationFrame(f); else res(); })(t0); });
KH.lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);

/* ===================== кошелёк DEMO (общий для всех игр) ===================== */
KH.wallet = {
  get() { const day = new Date().toISOString().slice(0, 10); try { if (localStorage.getItem('kho-day') !== day) { localStorage.setItem('kho-day', day); localStorage.setItem('kho-bal', '10000'); } const b = parseFloat(localStorage.getItem('kho-bal')); return isFinite(b) ? b : 10000; } catch (e) { return 10000; } },
  set(v) { try { localStorage.setItem('kho-bal', String(Math.round(v * 100) / 100)); } catch (e) {} },
  add(v) { this.set(this.get() + v); },
};

/* ===================== качество ===================== */
KH.quality = (() => { try { return localStorage.getItem('kho-q') || (matchMedia('(max-width:760px)').matches ? 'MED' : 'HIGH'); } catch (e) { return 'HIGH'; } })();
KH.Q = () => ({ LOW: 0, MED: 1, HIGH: 2, ULTRA: 3 })[KH.quality];
KH.onQuality = [];

/* ===================== частицы и эффекты (Canvas2D, аддитивное свечение) ===================== */
const FX = KH.fx = { parts: [], rings: [], run: false };
FX.init = () => { FX.cv = $('fxCv'); FX.x = FX.cv.getContext('2d'); const rs = () => { FX.cv.width = innerWidth; FX.cv.height = innerHeight; }; rs(); addEventListener('resize', rs); };
FX.loop = () => {
  const x = FX.x; x.clearRect(0, 0, FX.cv.width, FX.cv.height); x.globalCompositeOperation = 'lighter';
  FX.parts = FX.parts.filter(p => p.life > 0);
  for (const p of FX.parts) {
    p.life--; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag;
    const a = Math.max(0, p.life / p.max) * (p.alpha || 1), r = p.r * (p.grow ? 1 + (1 - p.life / p.max) * p.grow : 1);
    const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
    g.addColorStop(0, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a})`); g.addColorStop(.35, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a * .35})`); g.addColorStop(1, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},0)`);
    x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, r * 3, 0, 7); x.fill();
  }
  FX.rings = FX.rings.filter(r => r.t < r.ms);
  for (const r of FX.rings) {
    r.t += 16; const k = r.t / r.ms; x.strokeStyle = `rgba(${r.c[0]},${r.c[1]},${r.c[2]},${(1 - k) * .9})`; x.lineWidth = r.w * (1 - k) + 1;
    x.beginPath(); x.arc(r.x, r.y, r.R * KH.ease.out(k), 0, 7); x.stroke();
  }
  if (FX.parts.length || FX.rings.length) requestAnimationFrame(FX.loop); else { FX.run = false; x.clearRect(0, 0, FX.cv.width, FX.cv.height); }
};
FX.kick = () => { if (!FX.run) { FX.run = true; requestAnimationFrame(FX.loop); } };
FX.max = () => [350, 700, 1200, 1800][KH.Q()];
FX.add = p => { if (FX.parts.length < FX.max()) FX.parts.push(p); };
FX.PAL = { fire: [[255, 210, 110], [255, 130, 40], [255, 80, 30], [255, 235, 170]], gold: [[255, 220, 120], [255, 190, 80], [255, 245, 200]], aqua: [[120, 230, 255], [80, 180, 255], [200, 250, 255]], flag: [[0, 170, 255], [255, 40, 70], [0, 210, 100], [255, 225, 130]], violet: [[200, 120, 255], [255, 120, 220], [140, 160, 255]], green: [[120, 255, 160], [200, 255, 120], [80, 230, 200]], white: [[255, 255, 255], [220, 235, 255]] };
FX.burst = (x, y, n = 40, pal = FX.PAL.fire, pow = 6, opt = {}) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = pow * (.25 + Math.random()); FX.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opt.up || 1.2), g: opt.g ?? .1, drag: .975, r: (opt.r || 1.6) + Math.random() * 2.4, life: 45 + Math.random() * 45, max: 90, c: pal[i % pal.length] }); } FX.kick(); };
FX.ring = (x, y, R = 120, c = [255, 210, 120], ms = 700, w = 6) => { FX.rings.push({ x, y, R, c, ms, w, t: 0 }); FX.kick(); };
FX.embers = (ms = 3000, d = 4, pal = FX.PAL.fire) => { const t0 = performance.now(); (function f(n) { for (let i = 0; i < d; i++) FX.add({ x: Math.random() * innerWidth, y: innerHeight + 10, vx: (Math.random() - .5) * 1.2, vy: -2 - Math.random() * 4, g: -.01, drag: .996, r: 1 + Math.random() * 2.2, life: 130 + Math.random() * 80, max: 210, c: pal[(Math.random() * pal.length) | 0] }); FX.kick(); if (n - t0 < ms) requestAnimationFrame(f); })(t0); };
FX.fireworks = (ms = 4000, pals = [FX.PAL.fire, FX.PAL.gold]) => { const t0 = performance.now(); const go = () => { if (performance.now() - t0 > ms) return; const x = innerWidth * (.12 + Math.random() * .76), y = innerHeight * (.1 + Math.random() * .35); FX.burst(x, y, 70, pals[(Math.random() * pals.length) | 0], 7, { g: .08 }); FX.ring(x, y, 90, [255, 230, 180], 600, 3); setTimeout(go, 260 + Math.random() * 300); }; go(); };
FX.trail = (x, y, pal = FX.PAL.fire, n = 2, r = 2.5) => { for (let i = 0; i < n; i++) FX.add({ x: x + (Math.random() - .5) * 4, y: y + (Math.random() - .5) * 4, vx: (Math.random() - .5) * .8, vy: (Math.random() - .5) * .8, g: 0, drag: .95, r: r + Math.random() * 1.5, life: 26 + Math.random() * 14, max: 40, c: pal[(Math.random() * pal.length) | 0] }); FX.kick(); };
FX.pop = (x, y, text, color) => { const d = document.createElement('div'); d.className = 'kh-pop'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.textShadow = `0 0 14px ${color},0 3px 0 rgba(0,0,0,.6)`; document.body.appendChild(d); setTimeout(() => d.remove(), 1350); };
FX.shake = (ms = 400, amp = 8) => { const el = document.body, t0 = performance.now(); (function f(n) { const k = (n - t0) / ms; if (k >= 1) { el.style.transform = ''; return; } const a = amp * (1 - k); el.style.transform = `translate(${(Math.random() - .5) * a}px,${(Math.random() - .5) * a}px)`; requestAnimationFrame(f); })(t0); };

/* ===================== шейдерный фон (WebGL) ===================== */
const BG = KH.bg = { u: { uI: 1, uK: 0, uM: 0, uF: 0, uX: 0, uY: 0 } };
BG.init = (frag) => {
  const c = $('bg'); const gl = c.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { c.style.background = 'radial-gradient(#201030,#04030a)'; return; }

<script>/* АЛХИМИЯ — математика. На столе 5 закрытых ингредиентов (RNG до выбора), игрок выбирает 3 и бросает в котёл.

var ALCH = (function () {

    gold:   { n: 'Золото', g: '☉', c: [255, 200, 70], w: 2.5, t: 'gold' },

  if (el) { cx.save(); cx.shadowColor = rgb(c); cx.shadowBlur = 14; sym(v.id, 0, by, br * .48, el.t === 'common' ? '#fff' : '#fff6d0', 2.4); cx.restore(); }
  else { cx.font = `800 ${br * .8}px Cinzel,serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = `rgba(230,200,255,${.55 + .3 * Math.sin(t * 2 + v.i)})`; cx.fillText('?', 0, by + 2); }
  cx.restore();
  if (el && v.open && !v.fly && v.a > .3) { cx.font = `700 ${Math.max(10, s * .12)}px Montserrat,sans-serif`; cx.textAlign = 'center'; cx.fillStyle = rgb(c.map(k => Math.min(255, k + 60)), v.a); cx.fillText(el.n, x, y + by + br + 16); }
}

// ---------- котёл ----------
function cauldron(t) {
  const { cx: X, cy: Y, Rc: R } = L, sh = cauldronShake > 0 ? (Math.random() - .5) * cauldronShake * 8 : 0;
  potion = potion.map((k, i) => k + (potionT[i] - k) * .04);
  cx.save(); cx.translate(X + sh, Y);
  // огонь
  const fl = heat + boil * .8;
  if (Math.random() < .55 + fl * .4) for (let k = 0; k < 1 + fl * 2; k++) FX.add({ x: X + (Math.random() - .5) * R * 1.1, y: Y + R * .95, vx: (Math.random() - .5) * .6, vy: -1.2 - Math.random() * 2 * fl, g: -.02, drag: .96, r: 2 + Math.random() * 3 * fl, life: 20, max: 26, c: (stone ? FX.PAL.flag : FX.PAL.fire)[(Math.random() * 4) | 0] });
  FX.kick();
  // ножки и тень
  cx.fillStyle = 'rgba(0,0,0,.5)'; cx.beginPath(); cx.ellipse(0, R * 1.02, R * 1.05, R * .16, 0, 0, 7); cx.fill();
  cx.fillStyle = '#16121a'; [-.6, .6].forEach(f => { cx.beginPath(); cx.moveTo(R * f - 8, R * .7); cx.lineTo(R * f * 1.1 - 4, R * 1.02); cx.lineTo(R * f * 1.1 + 6, R * 1.02); cx.lineTo(R * f + 8, R * .7); cx.fill(); });
  // тело
  const g = cx.createRadialGradient(-R * .35, -R * .1, R * .1, 0, 0, R * 1.1);
  g.addColorStop(0, '#4a3f4e'); g.addColorStop(.55, '#1f1a24'); g.addColorStop(1, '#09070b');
  cx.fillStyle = g; cx.beginPath(); cx.ellipse(0, R * .05, R, R * .82, 0, Math.PI * 1.02, Math.PI * 1.98, true); cx.closePath(); cx.fill();
  // отблеск зелья на металле
  cx.save(); cx.globalCompositeOperation = 'lighter'; const gr = cx.createRadialGradient(0, -R * .1, 0, 0, -R * .1, R); gr.addColorStop(0, rgb(potion, .18 + boil * .15)); gr.addColorStop(1, 'rgba(0,0,0,0)'); cx.fillStyle = gr; cx.beginPath(); cx.ellipse(0, R * .05, R, R * .82, 0, 0, Math.PI); cx.fill(); cx.restore();
  // узор-орнамент на котле
  cx.strokeStyle = 'rgba(200,160,90,.35)'; cx.lineWidth = 1.5; cx.beginPath(); cx.ellipse(0, R * .25, R * .9, R * .18, 0, 0, Math.PI); cx.stroke();
  for (let k = -3; k <= 3; k++) sym(['fire', 'water', 'air', 'gold', 'earth', 'salt', 'sulf'][k + 3], k * R * .24, R * .42 - Math.abs(k) * R * .02, R * .06, 'rgba(210,170,100,.45)', 1.2);
  // поверхность зелья
  const sy = -R * .02, rx = R * .86, ry = R * .2;
  cx.save(); cx.beginPath(); cx.ellipse(0, sy, rx, ry, 0, 0, 7); cx.clip();
  const sg = cx.createRadialGradient(0, sy, 0, 0, sy, rx); sg.addColorStop(0, rgb(potion.map(k => Math.min(255, k * 1.4 + 40)))); sg.addColorStop(1, rgb(potion.map(k => k * .4)));
  cx.fillStyle = sg; cx.fillRect(-rx, sy - ry, rx * 2, ry * 2);
  cx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 7; k++) { const a = t * (.4 + k * .07) + k; cx.strokeStyle = rgb([255, 255, 255], .07 + boil * .05); cx.lineWidth = 2; cx.beginPath(); cx.ellipse(Math.cos(a) * rx * .3, sy + Math.sin(a * 1.3) * ry * .3, rx * (.2 + .1 * k % .5), ry * .3, 0, 0, 7); cx.stroke(); }
  // пузыри
  const nb = 3 + boil * 14; for (let k = 0; k < nb; k++) { const ph = (t * (.5 + boil) + k * .37) % 1, bx = Math.sin(k * 12.9898) * rx * .8, br = (2 + (k % 4) * 2) * (1 + boil) * (ph < .85 ? ph / .85 : 1); cx.strokeStyle = rgb([255, 255, 255], (1 - ph) * .7); cx.lineWidth = 1.3; cx.beginPath(); cx.arc(bx, sy + Math.cos(k * 7.1) * ry * .5, br, 0, 7); cx.stroke(); }
  cx.restore();
  // ободок
  cx.strokeStyle = '#5c5060'; cx.lineWidth = R * .07; cx.beginPath(); cx.ellipse(0, sy, rx * 1.04, ry * 1.12, 0, 0, 7); cx.stroke();
  cx.strokeStyle = 'rgba(255,230,200,.25)'; cx.lineWidth = 1.5; cx.beginPath(); cx.ellipse(0, sy - 2, rx * 1.04, ry * 1.12, 0, Math.PI * 1.1, Math.PI * 1.6); cx.stroke();
  // пар над котлом
  if (Math.random() < .25 + boil * .6) FX.add({ x: X + (Math.random() - .5) * rx * 1.3, y: Y + sy, vx: (Math.random() - .5) * .4, vy: -.6 - Math.random() * (1 + boil * 2), g: -.004, drag: .985, r: 5 + Math.random() * 7, life: 70, max: 70, c: potion.map(k => Math.min(255, k * .7 + 60)) });
  cx.restore();
  if (cauldronShake > 0) cauldronShake = Math.max(0, cauldronShake - .02);
  boil = Math.max(0, boil - .004);
}

function draw(tm) {
  const t = tm / 1000; cx.clearRect(0, 0, W, H);
  // полка
  cx.fillStyle = 'rgba(40,24,16,.85)'; const shelfY = L.vy + L.vh * .52; cx.fillRect(L.cx - L.sp * 2.8, shelfY, L.sp * 5.6, 8); cx.fillStyle = 'rgba(255,190,120,.12)'; cx.fillRect(L.cx - L.sp * 2.8, shelfY, L.sp * 5.6, 2);
  cauldron(t);
  vials.forEach(v => { v.hov += ((v.hover && state === 'pick' ? 1 : 0) - v.hov) * .2; v.lift += ((v.sel ? 1 : 0) - v.lift) * .15; vial(v, t); });
  if (state === 'pick') { cx.font = `800 ${W < 760 ? 13 : 16}px Montserrat,sans-serif`; cx.textAlign = 'center'; cx.fillStyle = `rgba(255,225,160,${.7 + .3 * Math.sin(t * 3)})`; const left = need - vials.filter(v => v.sel).length; cx.fillText(`ВЫБЕРИ ЕЩЁ ${left} ${left === 1 ? 'ИНГРЕДИЕНТ' : left < 5 ? 'ИНГРЕДИЕНТА' : 'ИНГРЕДИЕНТОВ'}`, L.cx, L.vy + L.vh * .9 + 18); }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- ввод ----------
const hit = (e) => { const x = e.clientX, y = e.clientY; return vials.find(v => !v.gone && Math.abs(x - v.x) < L.vh * .42 && y > v.y - L.vh * .6 && y < v.y + L.vh * .6); };
cv.addEventListener('pointermove', e => { const h = hit(e); vials.forEach(v => v.hover = v === h); cv.style.cursor = h && state === 'pick' ? 'pointer' : 'default'; });
cv.addEventListener('pointerdown', e => { if (state !== 'pick') return; const v = hit(e); if (v) toggle(v); });
function toggle(v) {
  if (v.sel) { v.sel = false; A.sfxs.tick(); return; }
  v.sel = true; A.ready && A.sfxs.note(vials.filter(x => x.sel).length * 2, 1, .1); FX.burst(v.x, v.y, 14, FX.PAL.violet, 2.5);
  if (vials.filter(x => x.sel).length >= need) { state = 'brew'; const r = pickRes; pickRes = null; setTimeout(() => r(vials.filter(x => x.sel).map(x => x.i)), 250); }
}
function choose(n, auto) {
  need = n; state = 'pick';
  return new Promise(res => { pickRes = res; if (auto) { const order = RNG.shuffle([0, 1, 2, 3, 4]).slice(0, n); order.forEach((i, k) => setTimeout(() => state === 'pick' && !vials[i].sel && toggle(vials[i]), 300 + k * 260 * KH.speed)); } });
}

// ---------- анимация варки ----------
async function pour(v) {
  v.fly = true; const x0 = v.x, y0 = v.y, x1 = L.cx + (v.i - 2) * L.Rc * .12, y1 = L.cy - L.Rc * .75;
  A.ready && A.sfxs.whoosh();
  await KH.tween(520 * KH.speed, k => { v.x = KH.lerp(x0, x1, k); v.y = KH.lerp(y0, y1, k) - Math.sin(k * Math.PI) * 60; v.rot = k * 2.1; v.sc = 1 - k * .25; }, KH.ease.inOut);
  const c = EL[v.id].c;
  FX.burst(L.cx, L.cy - L.Rc * .05, 40, [c, c.map(k => Math.min(255, k + 80)), [255, 255, 255]], 5);
  FX.ring(L.cx, L.cy - L.Rc * .02, L.Rc * .9, c, 600, 3);
  if (A.ready) { A.noiseHit(A.ctx.currentTime, .35, .12, 'lowpass', 900, 1, 's'); A.sfxs.ping(); }
  await KH.tween(200, k => { v.a = 1 - k; v.y = y1 + k * 30; });
  v.gone = true; boil = Math.min(1, boil + .35); heat = Math.min(1, heat + .1);
}
async function brew(rr, picks, mult, bet) {
  // открываем выбранные по одному и бросаем в котёл
  const picked = [];
  for (const i of picks) {
    const v = vials[i]; v.id = rr.table[i]; v.open = true; FX.burst(v.x, v.y, 24, [EL[v.id].c, [255, 255, 255]], 3);
    if (A.ready) A.sfxs.bell(EL[v.id].t === 'common' ? 2 : EL[v.id].t === 'rare' ? 4 : 7, 1, .07);
    if (v.id === 'stone') { await UI.title('ФИЛОСОФСКИЙ КАМЕНЬ?!', '', 900); }
    await KH.sleep(380);
    await pour(v); picked.push(EL[v.id].c); potionT = mixC(picked); setPotion(potionT);
  }
  // открываем то, что осталось на полке
  vials.filter(v => !v.gone).forEach(v => { v.id = rr.table[v.i]; v.open = true; v.a = .35; });
  // реакция
  const res = rr.res; boil = 1; cauldronShake = .5;
  if (A.ready) A.sfxs.rise(900);
  await KH.sleep(900);
  const m = Math.round(mult * 100) / 100;
  if (m <= 0) { potionT = [40, 40, 40]; setPotion(potionT); for (let k = 0; k < 40; k++) FX.add({ x: L.cx + (Math.random() - .5) * L.Rc, y: L.cy - L.Rc * .1, vx: (Math.random() - .5) * 2, vy: -1 - Math.random() * 3, g: -.01, drag: .97, r: 6 + Math.random() * 8, life: 60, max: 60, c: [60, 60, 60] }); FX.kick(); A.sfxs.lose(); FX.pop(L.cx, L.cy - L.Rc * 1.1, res.name.toUpperCase()); return; }
  const big = m >= 5, gold = /Золот|Царская/.test(res.name);
  if (gold) { potionT = [255, 200, 60]; setPotion(potionT); }
  BG.flash(big ? .6 : .25, 600); FX.ring(L.cx, L.cy, L.Rc * (big ? 3 : 1.8), potionT, 900, big ? 6 : 3);
  FX.burst(L.cx, L.cy - L.Rc * .1, big ? 160 : 60, gold ? FX.PAL.gold : [potionT, [255, 255, 255], FX.PAL.violet[1]], big ? 10 : 5);
  if (big) { FX.shake(400, 8); for (let k = 0; k < 30; k++) FX.add({ x: L.cx + (Math.random() - .5) * 30, y: L.cy - L.Rc * .1, vx: (Math.random() - .5) * 1.5, vy: -6 - Math.random() * 8, g: .05, drag: .99, r: 3, life: 70, max: 70, c: potionT }); }
  A.sfxs.win(m);
  FX.pop(L.cx, L.cy - L.Rc * 1.15, `${res.name.toUpperCase()}  ×${m}`);
  UI.setWin(m * bet);
  // книга рецептов
  if (book.indexOf(res.name) < 0) { book.push(res.name); try { localStorage.setItem('kho-alch-book', JSON.stringify(book)); } catch (e) {} await KH.sleep(500); FX.pop(L.cx, L.cy - L.Rc * 1.45, `📖 НОВЫЙ РЕЦЕПТ · ${book.length} ОТКРЫТО`); A.sfxs.bell(9, 1, .06); }
  await KH.sleep(big ? 1200 : 600);
}
let book = []; try { book = JSON.parse(localStorage.getItem('kho-alch-book') || '[]'); } catch (e) {}

async function reset() {
  vials.forEach(v => { if (!v.gone) v.fly = true; });
  await KH.tween(300, k => vials.forEach(v => { if (!v.gone) v.a = Math.min(v.a, 1 - k); }));
  newVials(); vials.forEach(v => v.a = 0); potionT = [120, 60, 160]; setPotion(potionT, 1200);
  await KH.tween(300, k => vials.forEach(v => v.a = k));
}

async function round({ bet, extra }) {
  await reset();
  const picks = await choose(extra ? 4 : 3, UI.auto > 0);
  const rr = ALCH.round(extra, picks);
  await brew(rr, picks, rr.res.mult, bet);
  if (rr.free) {
    // бонус «Философский камень»
    await KH.sleep(500); stone = 1; UI.cine(true); A.setState('bonus'); A.sfxs.bonus(); BG.to('uK', 1, 1200); BG.to('uI', 1.8, 1200);
    FX.burst(L.cx, L.cy - L.Rc * .3, 200, FX.PAL.flag, 9); FX.ring(L.cx, L.cy, L.Rc * 4, [255, 80, 60], 1400, 8); FX.shake(700, 10);
    await UI.title('ФИЛОСОФСКИЙ КАМЕНЬ', `${ALCH.FREE} БЕСПЛАТНЫХ ВАРОК · ВСЁ ×${ALCH.FREE_MULT}`, 2800);
    UI.cine(false); let sum = rr.res.mult;
    for (let k = 0; k < rr.free.length; k++) {
      const f = rr.free[k]; UI.msg(`Варка ${k + 1} из ${rr.free.length} · ×${ALCH.FREE_MULT}`, 1800);
      await reset(); need = 3; state = 'brew';
      for (const i of f.picks) { vials[i].sel = true; await KH.sleep(180); }
      await brew(f, f.picks, f.res.mult, bet); sum += f.res.mult; UI.setWin(sum * bet);
      await KH.sleep(300);
    }
    stone = 0; BG.to('uK', 0, 1500); BG.to('uI', 1, 1500); A.setState('base');
    await UI.title('КАМЕНЬ РАССЫПАЛСЯ', `ВСЕГО ${KH.fmt(sum * bet)} DEMO`, 2000);
  }
  state = 'idle';
  const win = Math.round(rr.total * bet * 100) / 100;
  if (win > 0) await UI.bigWin(win, UI.cost(), {
    start: tier => { boil = 1; heat = 1; BG.to('uI', 2.5, 600); if (tier >= 2) { // «Взрыв лаборатории»
        BG.flash(1, 900); FX.shake(900, 14); FX.burst(L.cx, L.cy - L.Rc * .2, 300, FX.PAL.gold, 13); FX.fireworks(2500, [FX.PAL.gold, FX.PAL.violet, FX.PAL.fire]); A.ready && A.sfxs.boom(.8); } },
    end: () => { BG.to('uI', 1, 1000); heat = .4; },
  });
  return win;
}

// музыка: оригинальная тема в ладу, близком к сегяху — балабан, колокольца, пэды
A.music({

});

UI.build({
  title: 'АЛХИМИЯ', sub: 'КОТЁЛ, ГДЕ РОЖДАЮТСЯ СТИХИИ', action: 'ВАРИТЬ', start: 'РАЗЖЕЧЬ ОГОНЬ', back: 'index.html',
  acc: '#c9a0ff', acc2: '#ffb34a', pal: FX.PAL.violet, fw: [FX.PAL.violet, FX.PAL.gold],
  extra: { label: 'РЕДКИЙ ИНГРЕДИЕНТ', desc: 'В котёл идут 4 ингредиента, засчитывается лучший рецепт из трёх', cost: ALCH.EXTRA_COST },
  round,

  ${row('Царская водка: 3 × Золото', 50)}${row('Tria Prima: Ртуть + Соль + Сера', 12)}${row('Чистая редкая стихия: 3 × Ртуть / Соль / Сера', 7.5)}${row('Двойное золото', 5)}${row('Чистая стихия: 3 × Огонь / Вода / Земля / Воздух', 2)}${row('Двойная редкая стихия', 1)}${row('Гармония: 3 разные базовые стихии', .9)}${row('Двойная базовая стихия', .4)}${row('Пар / Молния / Глина', .3)}</table>
  <p>Одно Золото добавляет к слабому рецепту +×1.2. <b>Квинтэссенция</b> ✦ — дикий ингредиент: становится тем, что даёт лучший рецепт.</p>
  <h3>Философский камень</h3><p>Если в котёл попал Камень, он растворяется как дикий ингредиент и запускает бонус: ${ALCH.FREE} бесплатных варок, все выигрыши ×${ALCH.FREE_MULT}. Случается примерно раз в 60 варок.</p>
  <h3>Взрыв лаборатории</h3><p>Выигрыш от ×25 разносит лабораторию фейерверком.</p>
  <h3>Экстра-шанс «Редкий ингредиент»</h3><p>Стоит +${ALCH.EXTRA_COST * 100}% к ставке. Ты выбираешь 4 колбы, и засчитывается лучшая тройка; заодно растёт шанс на Камень.</p>
  <h3>Книга рецептов</h3><p>Открыто рецептов: <b>${book.length}</b>. ${book.length ? book.join(' · ') : 'пока ни одного'}</p>
  <p class="kh-note">RTP ≈ 95% (по симуляции, без экстра-шанса и с ним). Это DEMO-игра: кредиты не настоящие, генератор случайных чисел не сертифицирован. Разработчик: Khayyam.</p>`; },
});
window.__game = { round, ALCH };
window.__test_wait = () => { if (state === "pick") { const v = vials.find(v => !v.sel); v && toggle(v); } return 0; };
})();
